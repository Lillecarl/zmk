# Present the touchpad on USB as an accessory trackpad per Apple's Accessory
# Design Guidelines, chapter 15 (iPadOS 14.5+), under the board's own VID.
# Replaces PTP on USB, so Windows and Linux lose it in this build:
#   west build ... -- -DSHIELD=daisy -DEXTRA_CONF_FILE=boards/shields/daisy/ipad.conf
CONFIG_HID_PASSTHROUGH_USB_APPLE=y
