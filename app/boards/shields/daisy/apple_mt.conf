# Prototype: present the touchpad to macOS as an Apple top-case trackpad, so
# macOS's own multitouch driver does pointer and gestures. Apple's USB vendor
# ID, so private test builds only:
#   west build ... -- -DSHIELD=daisy -DEXTRA_CONF_FILE=boards/shields/daisy/apple_mt.conf
CONFIG_HID_PASSTHROUGH_USB_APPLE_MT=y
CONFIG_USB_DEVICE_VID=0x05AC
CONFIG_USB_DEVICE_PID=0x0272
