CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# USB: ZMK uses the new device stack (USB_DEVICE_STACK_NEXT). The flower/daisy
# board defconfig sets this for its own PCB build, but shield builds on
# dev-kit boards (e.g. nrf54lm20dk) don't inherit that, so enable it here.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=n

# ZMK BLE + battery reporting (npm1300 charger reports SoC)
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Exactly 4 BLE host profiles, cycled by the pairing button.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4

# LEDs - Not sure if will use PWM to control them
CONFIG_LED=y
CONFIG_PWM=y

# For nPM1300 and Touchpad
CONFIG_I2C=y

# Enable shell with many features for debugging
# Turn off for production firmware
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_LED_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_REGULATOR_SHELL=y
CONFIG_CBPRINTF_COMPLETE=y

CONFIG_INPUT=y

# Touchpad passthrough: exposes the I2C HID touchpad (PCT1036) as a separate
# HID interface on both USB and BLE, forwarding raw reports to the OS.
# This preserves full PTP multitouch, vendor feature reports, and FW update
# capability rather than converting to mouse events.
CONFIG_ZMK_HID_TOUCHPAD=y

# BLE: Larger ATT MTU so PTP input reports (29 bytes) fit in a single
# notification without fragmentation. Zephyr enforces minimums of 65/69/73.
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=73

CONFIG_ZMK_HID_INDICATORS=y

# Factory-test HID interface (factory_hid.c): vendor-defined HID channel the
# `aster` factory tool talks to over USB. Turn off for production firmware.
CONFIG_DAISY_FACTORY=y
