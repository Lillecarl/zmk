CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
# DEBUG ONLY -- revert before shipping. Mirrors the RTT log onto the console
# UART (uart00, 115200, TX P2.02 / RX P2.00) so a unit can be watched without a
# J-Link. Keep the log subsystem in deferred mode: LOG_MODE_IMMEDIATE blocks
# inside control transfers and breaks USB enumeration.
CONFIG_LOG_BACKEND_UART=y
# udc_dwc2 logs "Prepare RX" at INF for every control transfer
# (zephyr/drivers/usb/udc/udc_dwc2.c:662), which alone outruns 115200 baud and
# pushes everything else out of the deferred log buffer.
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_WRN=y
# RTT is switched off in boards/<board>.conf, which is where it was turned on
# (and which is applied after this file, so it has to be disabled there).

CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# USB: ZMK uses the new device stack (USB_DEVICE_STACK_NEXT). The flower/daisy
# board defconfig sets this for its own PCB build, but shield builds on
# dev-kit boards (e.g. nrf54lm20dk) don't inherit that, so enable it here.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=n
# Honor SET_PROTOCOL(Boot) from BIOS/UEFI hosts. The HID interface already
# advertises the boot-keyboard subclass, so without this a boot-protocol host
# gets our report-protocol packets (leading report-ID byte) and every key
# arrives shifted by one byte.
CONFIG_ZMK_USB_BOOT=y

# Run the CDC-ACM class work on its own workqueue, NOT the sysworkq. Its
# serial-state notification blocks on a semaphore with K_FOREVER until the
# transfer completes; on the default sysworkq that wedges the whole system
# workqueue when USB drops mid-transfer (part of the "everything freezes
# while unplugged" bug, see daisy.md "USB unplug wedges the sysworkq").
CONFIG_USBD_CDC_ACM_WORKQUEUE=y

# ZMK Studio: RPC over the "Daisy Studio" CDC-ACM port (daisy.overlay) and
# over BLE GATT. Unlock with FN+` (&studio_unlock in daisy.keymap).
CONFIG_ZMK_STUDIO=y

# ZMK BLE + battery reporting. The npm1300 charger driver only exposes the
# measured battery voltage, not a fuel-gauge SoC, so estimate the percentage
# from voltage via ZMK's lithium curve. The choice otherwise defaults to
# STATE_OF_CHARGE, a channel this driver returns -ENOTSUP for, leaving SoC
# stuck at 0. (The fork's npm13xx driver aliases SENSOR_CHAN_VOLTAGE — which
# ZMK's lithium fetch mode reads — onto its gauge-voltage measurement.)
CONFIG_ZMK_BLE=y

# A bonded-but-disconnected active profile advertises connectable undirected
# ADV_IND that is GAP *non-discoverable* (flags cleared, payload stripped), so
# a taken profile stays out of everyone else's pairing UIs while every host
# type -- including Apple's, whose accessory guidelines forbid the directed
# advertising this replaced on 2026-08-20 -- can still reconnect. Design and
# host-behavior source audit: ../aster/plans/reconnectable.md. Unlike directed
# advertising this needs neither the controller resolving list nor the
# nRF54LM20A AAR (see ../aster/issues/reset-reconnect-failure.md for that
# saga), so it is immune to the battery-only-boot empty-RL bug class.
#
# Set to n to fall back to always-discoverable advertising if a host turns out
# not to reconnect to non-discoverable adverts (also see the narrower
# CONFIG_ZMK_BLE_STEALTH_ADV_NAME escape hatch first).
CONFIG_ZMK_BLE_STEALTH_ADV=y
# NOTE: module-wide CONFIG_BT_HCI_CORE_LOG_LEVEL_DBG (+KEYS/SMP dbg) crashed
# this image into a boot loop before the app printed anything -- do not
# reintroduce. The same investigation uses targeted log lines in zephyr host
# id.c/smp.c instead (working-tree patch, marked TEMP).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y

# Report more frequently than the default (1 minute) to make it easier to test
# In practice though there's no reason for this, since battery charging and discharging takes much longer
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=5

# NOTE: relies on the prompt added to USB_DEVICE_PRODUCT in app/Kconfig — under
# the usb-next stack (USB_DEVICE_STACK=n) the stock symbol is unsettable and this
# assignment would be silently ignored (falls back to ZMK_KEYBOARD_NAME).
CONFIG_USB_DEVICE_PRODUCT="Touchpad KB"

# BLE Device Information Service: advertise Framework's identity over Bluetooth,
# not ZMK's default 0x1D50:0x615E (the OpenMoko community VID). Match USB.
CONFIG_BT_DIS_PNP_VID=0x32AC
CONFIG_BT_DIS_PNP_PID=0x0034
# 0x32AC is a USB-IF assignment, so declare the USB-IF namespace (2), not the
# Zephyr default of Bluetooth SIG (1).
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_MANUF_NAME_STR="Framework"

# Exactly 4 BLE host profiles, cycled by the pairing button.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4

# Preferred connection interval 7.5-10 ms (units of 1.25 ms). The ZMK
# default of 7.5-15 ms got us 15 ms from BlueZ (centrals tend to grant the
# max), and at 15 ms the ~131 Hz touchpad frames arrive as 2-per-connection-
# event bursts whose ~50 us arrival spacing trips libinput's touchpad jump
# detection (motion of the second frame is discarded -> cursor travels
# ~0.53x, measured 2026-07-19 with test_touchpad.py --gain). <=10 ms plus
# the driver's pace (granted interval + HID_PASSTHROUGH_BLE_PACE_MARGIN_US)
# gives one frame per event and regular arrivals whatever the pad's rate,
# and matches libinput's 10 ms Bluetooth velocity assumption.
# Strict centrals that reject this keep their own params (no worse than
# before). Keyboard latency improves as a side effect; idle power is
# covered by BT_PERIPHERAL_PREF_LATENCY (peripheral skips empty events).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=8

# The BT host's "BT RX WQ" thread runs bond/GATT settings saves during
# pairing; with settings -> ZMS -> flash -> radio-synced RRAM write the
# upstream default of 1200 bytes overflows (K_ERR_STACK_CHK_FAIL, whole
# kernel halts). Found 2026-07-15 with test_bluetooth.py re-pair phase.
CONFIG_BT_RX_STACK_SIZE=4096

# LEDs - Not sure if will use PWM to control them
CONFIG_LED=y
CONFIG_PWM=y

# For nPM1300 and Touchpad
CONFIG_I2C=y

# Deep sleep (MCU power-off) support. Selects POWEROFF +
# ZMK_PM_DEVICE_SUSPEND_RESUME, which runs each device's PM action hook
# before powering down (touchpad disables its DR interrupt on suspend).
# Enabled so the machinery is built, but the idle timeout is INT32_MAX
# (~24.8 days) so it never triggers on its own — automatic entry stays off
# while the wake-source investigation (sleep_debug.c) is open. Lower the
# timeout (e.g. 180000 = 3 min) to re-enable automatic deep sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2147483647

# Needed by protocol_switch.c: in WIRED mode with no cable attached it puts the
# SoC into System OFF (sys_poweroff) to save power, waking on a switch flip.
CONFIG_POWEROFF=y

# Enable shell with many features for debugging
# Turn off for production firmware
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_LED_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_REGULATOR_SHELL=y
CONFIG_USBD_SHELL=y
CONFIG_CBPRINTF_COMPLETE=y

CONFIG_INPUT=y

# Mashing 5+ keys must not overflow the input pipeline. A single scan pass of
# a 5-key transition emits 15 events (3 per key) into the global input queue
# (default 16 slots), and each event fans out x3 again through the
# deghost/composite chain; a full queue drops events (stuck/lost keys) and
# could deadlock the input thread against its own queue. Size both queues so
# a full-hand mash burst fits. See
# ~/clone/aster/issues/mash-input-queue-deadlock.md.
CONFIG_INPUT_QUEUE_MAX_MSGS=64
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=32

# Diodeless matrix: the scan drives one column and leaves the rest
# high-impedance (see input_gpio_matrix.c), so a row charged by the key on the
# previous column keeps that charge (only the weak internal pull-down drains
# it). Without a settle delay the row still reads high on the next column and
# reports a phantom press one column over (e.g. FN+mute -> real F1 plus a
# flickering B). Wait after driving each column so the floating rows discharge
# below the input threshold before we sample. Physics only needs ~1-2 RC (a
# few us); keep this small so a full 18-column scan stays well under the
# debounce-scan-period-ms below, or the scan reschedules itself back-to-back
# and starves the workqueue (no HID reports -> nothing types while held).
CONFIG_ZMK_INPUT_MATRIX_WAIT_BEFORE_INPUTS=25

# Touchpad passthrough: exposes the I2C HID touchpad (PCT1036) as a separate
# HID interface on both USB and BLE, forwarding raw reports to the OS.
# This preserves full PTP multitouch, vendor feature reports, and FW update
# capability rather than converting to mouse events.
CONFIG_ZMK_HID_TOUCHPAD=y

# Device PM hooks (no automatic power management without CONFIG_PM). The
# factory TOUCHPAD_POWER_SET command uses the touchpad driver's PM action to
# gate its data-ready interrupt around chip suspend.
CONFIG_PM_DEVICE=y

# BLE: Larger ATT MTU so PTP input reports (29 bytes) fit in a single
# notification without fragmentation. Zephyr enforces minimums of 65/69/73.
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=73

CONFIG_ZMK_HID_INDICATORS=y

# Factory-test HID interface (factory_hid.c): vendor-defined HID channel the
# `aster` factory tool talks to over USB. Turn off for production firmware.
CONFIG_DAISY_FACTORY=y

# Bluetooth Direct Test Mode in the split controller, for the factory PERT
# commands (group 0xA in factory.h): raw-PHY per-channel packet-error-rate
# measurement against the dongle (`aster v1-dongle --pert`). The promptless
# BT_CTLR_DTM the ll_test_* API needs is only reachable via this HCI symbol's
# select. Harmless in normal operation (DTM only runs when explicitly started
# over the factory interface); can be dropped for production firmware.
CONFIG_BT_CTLR_DTM_HCI=y

# Reboot on a fatal error instead of halting with interrupts locked. A halt
# bricks the keyboard until a physical reset (it runs from battery, so a USB
# replug does nothing) and looks identical to any other wedge from the host;
# a reboot recovers on its own and is observable as a USB re-enumeration.
# Asserts make controller-state violations fault deterministically at the
# offending call instead of as undefined behavior later (added during PERT
# bring-up 2026-07-25; ASSERT costs flash/cycles and can come back out once
# the radio-handoff path has soaked).
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_ASSERT=y
