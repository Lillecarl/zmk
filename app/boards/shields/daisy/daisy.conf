CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Disable NFC on the devkit to use those pins as GPIO
# GPIO P0.09 and P0.10
CONFIG_NFCT_PINS_AS_GPIOS=y

# Disable UART on the devkit to use those pins as GPIO
# GPIO P0.05 and P0.07
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n

# LEDs - Not sure if will use PWM to control them
CONFIG_LED=y
CONFIG_PWM=y

# Enable shell with many features for debugging
# Turn off for production firmware
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_LED_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_SENSOR_SHELL=n

CONFIG_INPUT=y
CONFIG_ZMK_HID_TOUCHPAD=y

#CONFIG_BUILD_OUTPUT_UF2=y
