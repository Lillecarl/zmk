#
# Disable NFC on the devkit to use those pins as GPIO
# GPIO P0.09 and P0.10
CONFIG_NFCT_PINS_AS_GPIOS=y

# Disable UART on the devkit to use those pins as GPIO
# GPIO P0.05 and P0.07
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n

CONFIG_ZMK_KEYBOARD_NAME="nRF52 DK Daisy"
