# Flash subsystem — needed for ZMS settings storage.
# The DK's defconfig doesn't enable this; the daisy_kb_evt board does.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# USB VID/PID — match the recovery bootloader so the same identity is
# advertised in normal app and recovery mode.
CONFIG_USB_DEVICE_VID=0x32AC
CONFIG_USB_DEVICE_PID=0x0034

# CDC ACM class for the ZMK Studio serial port (daisy.overlay).
CONFIG_USBD_CDC_ACM_CLASS=y

# Serial / line control for the CDC ACM Studio transport
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Retention-driven entry into mcuboot serial recovery (factory HID
# bootloader-jump, factory_hid.c)
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
