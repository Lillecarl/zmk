# DEBUG ONLY -- RTT off, logs go out uart00 instead (CONFIG_LOG_BACKEND_UART in
# daisy.conf) so a unit can be watched without a J-Link. Dropping
# USE_SEGGER_RTT takes LOG_BACKEND_RTT, SHELL_BACKEND_RTT and RTT_CONSOLE with
# it (they all depend on it) and frees the RTT buffers.
# Restore all four lines to =y to go back to JLinkRTTViewer.
CONFIG_USE_SEGGER_RTT=n
#CONFIG_LOG_BACKEND_RTT=y
#CONFIG_SHELL_BACKEND_RTT=y
# Logs own RTT up-buffer 0 (terminal); shell gets its own buffer pair.
#CONFIG_SHELL_BACKEND_RTT_BUFFER=1

# USB VID/PID — same identity advertised by app and recovery bootloader
CONFIG_USB_DEVICE_VID=0x32AC
CONFIG_USB_DEVICE_PID=0x0034
CONFIG_USB_DEVICE_MANUFACTURER="Framework"

# Second CDC ACM endpoint on the existing usbd for runtime mcumgr.
CONFIG_USBD_CDC_ACM_CLASS=y

# Serial / line control for the CDC ACM mcumgr transport
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Retention-driven entry into mcuboot serial recovery
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# MCUmgr: identity + buttonless reset into serial recovery
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1220
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_RESET_BOOT_MODE=y

# Settings storage for BLE bonding/GATT state. RRAM supports byte-level
# writes without erase, so ZMS is the right backend (NVS would work but
# is tuned for flash with explicit erase). App image only: mcuboot does
# not enable SETTINGS, and a backend choice set there is a Kconfig error.
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# See daisy_kb_evt conf: the default RRAM write buffer of 1 line makes the
# radio-synced flash timeslot interval underflow; writes stall and the LL
# controller asserts during BLE activity.
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=16
