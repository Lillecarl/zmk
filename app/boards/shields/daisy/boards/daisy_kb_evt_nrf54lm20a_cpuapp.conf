# Log over SEGGER RTT (via the SWD debugger) instead of uart00, which isn't
# wired to the debug probe's virtual COM port. View with JLinkRTTViewer.
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_RTT=y
# Logs own RTT up-buffer 0 (terminal); shell gets its own buffer pair.
CONFIG_SHELL_BACKEND_RTT_BUFFER=1

# USB VID/PID — same identity advertised by app and recovery bootloader
CONFIG_USB_DEVICE_VID=0x32AC
CONFIG_USB_DEVICE_PID=0x0034
CONFIG_USB_DEVICE_MANUFACTURER="Framework"

# CDC ACM class for the ZMK Studio serial port (daisy.overlay).
CONFIG_USBD_CDC_ACM_CLASS=y

# Serial / line control for the CDC ACM Studio transport
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Retention-driven entry into mcuboot serial recovery (factory HID
# bootloader-jump, factory_hid.c)
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# Settings storage for BLE bonding/GATT state. RRAM supports byte-level
# writes without erase, so ZMS is the right backend (NVS would work but
# is tuned for flash with explicit erase). App image only: mcuboot does
# not enable SETTINGS, and a backend choice set there is a Kconfig error.
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# RRAM writes with the (default, correct) TICKER radio sync: the default
# NRF_RRAM_WRITE_BUFFER_SIZE=1 gives a 500 us flash timeslot, but
# soc_flash_nrf_ticker.c subtracts a fixed 1700 us switching time from the
# slot to get the retry interval — 500-1700 underflows to ~71 minutes. If
# the first timeslot is skipped (its prepare callback has only a 200 us
# grace window; USB/I2C load makes lateness routine here), the write blocks
# the system workqueue until it fails with -ETIMEDOUT, bt_keys/bt_gatt
# saves fail, and the ll_sw controller eventually asserts and reboots.
# 16 lines -> 4000 us slot -> sane 2300 us retry interval, and 16x fewer
# slots per settings write. (Underflow guard also patched in our zephyr
# fork; found 2026-07-15 debugging test_bluetooth.py hangs.)
# Do NOT use SOC_FLASH_NRF_RADIO_SYNC_NONE instead: unsynchronized RRAM
# writes silently kill the radio on this SoC (no advertising at all).
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=16

