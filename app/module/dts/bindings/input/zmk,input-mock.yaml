description: |
  Allows defining a mock input driver that simulates periodic input events.

compatible: "zmk,input-mock"

properties:
  event-startup-delay:
    type: int
    default: 0
    description: Milliseconds to delay before starting generating the events
  event-period:
    type: int
    default: 0
    description: Default milliseconds between each sync event, used when per-event delay is 0
  events:
    type: array
    description: List of tuples of (type, code, value, sync, delay_ms)
  exit-after:
    type: boolean
