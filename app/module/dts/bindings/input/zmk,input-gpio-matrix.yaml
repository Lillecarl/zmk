description: |
  GPIO keyboard matrix input device.

  Reports key state as Zephyr input events:
    INPUT_EV_ABS / INPUT_ABS_X  = column
    INPUT_EV_ABS / INPUT_ABS_Y  = row
    INPUT_EV_KEY / INPUT_BTN_TOUCH = pressed/released (sync)

compatible: "zmk,input-gpio-matrix"

include: base.yaml

properties:
  row-gpios:
    type: phandle-array
    required: true
  col-gpios:
    type: phandle-array
    required: true
  debounce-period:
    type: int
    required: false
    deprecated: true
    description: Deprecated. Use debounce-press-ms and debounce-release-ms instead.
  debounce-press-ms:
    type: int
    default: 5
    description: Debounce time for key press in milliseconds. Use 0 for eager debouncing.
  debounce-release-ms:
    type: int
    default: 5
    description: Debounce time for key release in milliseconds.
  debounce-scan-period-ms:
    type: int
    default: 1
    description: Time between reads in milliseconds when any key is pressed.
  poll-period-ms:
    type: int
    default: 10
    description: Time between reads in milliseconds when no key is pressed and ZMK_INPUT_MATRIX_POLLING is enabled.
  diode-direction:
    type: string
    default: row2col
    enum:
      - row2col
      - col2row
