CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

CONFIG_FLASH=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Single-slot serial recovery via USB CDC ACM, with retention-driven entry
# plus GPIO button entry. Each board overlay must define the mcuboot_button0
# (and optionally mcuboot_led0) DT alias.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_MCUBOOT_INDICATION_LED=y

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_BOOT_SERIAL_CDC_ACM_VID=0x32AC
CONFIG_BOOT_SERIAL_CDC_ACM_PID=0x0034
CONFIG_BOOT_SERIAL_CDC_ACM_MANUFACTURER_STRING="Framework"
CONFIG_BOOT_SERIAL_CDC_ACM_PRODUCT_STRING="Daisy Keyboard (Recovery)"
# Bootloader release number, BCD x.yz (lsusb bcdDevice). Increment on every
# bootloader change we ship; without it the descriptor encodes the Zephyr
# kernel version (4.04), which we don't control.
CONFIG_BOOT_SERIAL_CDC_ACM_BCD_DEVICE=0x0001
